{% extends 'eventos/base.html' %}
{% block content %}
<h2>{% if editando %}Editar{% else %}Nuevo{% endif %} Pago</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'pago_lista_todos' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
