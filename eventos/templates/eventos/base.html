<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos UNCuyo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    {% load static %}
    <style>
        body { background-color: #f4f5f7; }
        .sidebar {
            width: 240px;
            min-height: 100vh;
            background-color: #212529;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            overflow-y: auto;
            padding: 1.5rem 1rem;
        }
        .sidebar-logo img { width: 64px; }
        .sidebar-heading {
            color: #6c757d;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 1.2rem 0 0.4rem 0.5rem;
        }
        .sidebar .nav-link {
            color: #ced4da;
            border-radius: 6px;
            padding: 0.45rem 0.6rem;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #343a40;
            color: #fff;
        }
        .main-content { margin-left: 240px; padding: 1.5rem; }
        @media (max-width: 767.98px) {
            .main-content { margin-left: 0; }
        }
        .main-content {
            position: relative;
            z-index: 1;
        }
        .marca-agua {
            position: fixed;
            top: 50%;
            left: calc(240px + (100vw - 240px) / 2);
            transform: translate(-50%, -50%);
            width: 420px;
            opacity: 0.05;
            z-index: 0;
            pointer-events: none;
        }
        @media (max-width: 767.98px) {
            .marca-agua { width: 260px; }
        }
    </style>
</head>
<body>

    <!-- Barra superior solo en celular -->
    <nav class="navbar navbar-dark bg-dark d-md-none px-3">
        <button class="btn btn-outline-light btn-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMovil">
            <i class="bi bi-list"></i>
        </button>
        <span class="navbar-brand ms-2 mb-0">Eventos UNCuyo</span>
    </nav>

    <!-- Panel lateral fijo, solo en pantallas medianas/grandes -->
    <div class="sidebar d-none d-md-block">
        {% include 'eventos/_sidebar_nav.html' %}
    </div>

    <!-- Panel lateral deslizable, solo en celular -->
    <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="sidebarMovil">
        <div class="offcanvas-header">
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            {% include 'eventos/_sidebar_nav.html' %}
        </div>
    </div>

    <img src="{% static 'eventos/img/logo_marca_agua.png' %}" class="marca-agua d-none d-md-block" alt="">

    <div class="main-content">
        {% for mensaje in messages %}
        <div class="alert alert-{{ mensaje.tags }}">{{ mensaje }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
