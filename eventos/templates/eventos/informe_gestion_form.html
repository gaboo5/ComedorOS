{% extends 'eventos/base.html' %}
{% block content %}
<h2>Editar Informe de Gestión — {{ periodo }}</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'informe_gestion_detalle' periodo.id %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
