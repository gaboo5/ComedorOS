{% extends 'eventos/base.html' %}
{% block content %}
<h2>Personas Eventuales</h2>
<a href="{% url 'persona_eventual_crear' %}" class="btn btn-success mb-3">+ Nueva persona</a>
<table class="table table-striped">
    <thead><tr><th>Apellido</th><th>Nombre</th><th>DNI</th><th>Acciones</th></tr></thead>
    <tbody>
        {% for p in personas %}
        <tr>
            <td>{{ p.apellido }}</td>
            <td>{{ p.nombre }}</td>
            <td>{{ p.dni }}</td>
            <td><a href="{% url 'persona_eventual_editar' p.pk %}" class="btn btn-sm btn-outline-primary">Editar</a></td>
        </tr>
        {% empty %}
        <tr><td colspan="4" class="text-center text-muted">No hay personas cargadas</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
