{% extends 'eventos/base.html' %}
{% block content %}
<h2>¿Eliminar compra?</h2>
<p>Estás por eliminar la compra del <strong>{{ compra.fecha }}</strong> ({{ compra.proveedor|default:"sin proveedor" }}).</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'compra_lista' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
