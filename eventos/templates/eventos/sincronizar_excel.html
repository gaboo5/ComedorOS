{% extends 'eventos/base.html' %}
{% block content %}
<h2>Sincronizar desde Excel</h2>
<p class="text-muted">
    Subí la versión más reciente de <code>Informe_2026.xlsx</code>. Los eventos que hayas editado a mano en el sistema
    no se van a modificar; el resto se actualiza con lo que diga el archivo.
</p>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
        <input type="file" name="archivo" accept=".xlsx" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Sincronizar</button>
</form>
{% endblock %}
